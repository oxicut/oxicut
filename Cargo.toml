[workspace]
resolver = "3"
members = [
    "crates/oxcut-core",
    "crates/oxcut-models",
    "crates/oxcut-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Janos Rusiczki <janos.rusiczki@gmail.com>"]

[workspace.dependencies]
oxcut-core = { path = "crates/oxcut-core" }
oxcut-models = { path = "crates/oxcut-models" }
