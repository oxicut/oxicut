[workspace]
resolver = "3"
members = [
    "crates/oxicut-core",
    "crates/oxicut-models",
    "crates/oxicut-cli",
    "app/src-tauri",
]

# Image processing is unusably slow unoptimised; keep debug assertions on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.oxicut-core]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Janos Rusiczki <janos.rusiczki@gmail.com>"]

[workspace.dependencies]
oxicut-core = { path = "crates/oxicut-core" }
oxicut-models = { path = "crates/oxicut-models" }
