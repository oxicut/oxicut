name: Tests

# Runs on every pull request and every push to main, and by hand from the Actions tab (which tests everything).
# The web side always runs. The Rust side only runs when a Rust-related file changed, so a pull request
# that only touches the interface or the npm packages does not pay for the Rust build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the Rust job is needed. When in doubt it says yes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which files changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          # The engine, the app's Rust side (with its config and icons), the workspace files, the test
          # data the engine tests read, and this workflow.
          RUST_PATHS: '^(crates/|app/src-tauri/|benchmarks/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/ci\.yml$)'
        run: |
          rust=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "Changed files:"
            echo "$files"
            if echo "$files" | grep -Eq "$RUST_PATHS"; then rust=true; else rust=false; fi
          else
            echo "Could not list the changed files, so everything is tested."
          fi
          echo "Rust tests needed: $rust"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the web part
        working-directory: app
        run: npm ci

      - name: Check and build the web part
        working-directory: app
        run: npm run build

      - name: Test the web part
        working-directory: app
        run: npm test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Same cache as the release workflow, so a pull request starts warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true

      # The same downloads cache as the release workflow (ONNX Runtime comes with the Rust build).
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/ort.pyke.io
            ~/AppData/Roaming/ort.pyke.io
          key: downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ runner.os }}-

      - name: Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace
