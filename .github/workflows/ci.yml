name: Tests

# Runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Same cache as the release workflow, so a pull request starts warm.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the web part
        working-directory: app
        run: npm ci

      - name: Test the web part
        working-directory: app
        run: npm test

      - name: Check and build the web part
        working-directory: app
        run: npm run build

      - name: Test the engine and the app
        run: cargo test --workspace
