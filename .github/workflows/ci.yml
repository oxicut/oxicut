name: Tests

# Runs on every pull request and every push to main, and by hand from the Actions tab (which tests everything).
# Each side only runs when a file it depends on changed: a pull request that only touches documentation runs
# neither, one that only touches the interface or the npm packages skips the Rust build, and one that only
# touches the engine skips the web checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which sides are needed. When in doubt it says yes to both. A job that is skipped because of
  # this counts as passing, so a documentation-only pull request can still be merged.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which files changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          # Rust: the engine, the app's Rust side (with its config and icons), the workspace files, the test
          # data the engine tests read, and this workflow.
          RUST_PATHS: '^(crates/|app/src-tauri/|benchmarks/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/ci\.yml$)'
          # Web: everything in app/ except its Rust side (the interface, the packages, the build and
          # test settings), and this workflow.
          WEB_PATHS: '^(app/|\.github/workflows/ci\.yml$)'
          WEB_NOT: '^app/src-tauri/'
        run: |
          rust=true
          web=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "Changed files:"
            echo "$files"
            rust=false
            web=false
            if echo "$files" | grep -Eq "$RUST_PATHS"; then rust=true; fi
            if echo "$files" | grep -E "$WEB_PATHS" | grep -vEq "$WEB_NOT"; then web=true; fi
          else
            echo "Could not list the changed files, so everything is tested."
          fi
          echo "Rust tests needed: $rust"
          echo "Web checks needed: $web"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the web part
        working-directory: app
        run: npm ci

      - name: Check and build the web part
        working-directory: app
        run: npm run build

      - name: Test the web part
        working-directory: app
        run: npm test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # What is cached is the output of the three steps below (check, build and test each leave their own).
      # The cache is only written when its name is new, so after adding or changing a step here, change the
      # name once by hand (windows-ci, windows-ci-2, ...): the next run on main then makes a complete cache.
      # (The action ignores its `key` input when `shared-key` is set, so a hash of this file would not help.)
      # Pull requests only read it (they would each write a copy nobody else can use).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The same downloads cache as the release workflow (ONNX Runtime comes with the Rust build).
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/ort.pyke.io
            ~/AppData/Roaming/ort.pyke.io
          key: downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ runner.os }}-

      - name: Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace
