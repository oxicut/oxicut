[package]
name = "oxicut-app"
description = "OxiCut desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "oxicut_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxicut-core.workspace = true
oxicut-models.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.12.0"
base64 = "0.23.1"
directories = "6.0.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
